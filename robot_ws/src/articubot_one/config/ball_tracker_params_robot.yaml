detect_ball:
  ros__parameters:
    # tuning_mode: false # Could set this here but leave it off so it can be easily set by the launch script
    x_min: 0
    x_max: 100
    y_min: 33
    y_max: 100
    h_min: 27
    h_max: 55
    s_min: 76
    s_max: 255
    v_min: 0
    v_max: 255
    sz_min: 0
    sz_max: 25

detect_ball_3d:
  ros__parameters:
    h_fov: 1.089
    ball_radius: 0.033
    camera_frame: "camera_link_optical"

follow_ball:
  ros__parameters:
    rcv_timeout_secs: 1.0
    angular_chase_multiplier: 3.5
    forward_chase_speed: 1.0
    search_angular_speed: 2.5
    max_size_thresh: 0.1
    filter_value: 0.9
